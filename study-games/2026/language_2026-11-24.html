<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b2852"><title>שפה | שמות עצם · שמות תואר</title><style>
:root{--navy:#1b2852;--purple:#5d47c8;--plum:#9f62df;--cream:#fffaf1;--green:#1c9166;--red:#bb365b;--ink:#1e2a44;--muted:#61708a;--line:#dbe1ef}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;direction:rtl;background:radial-gradient(circle at 90% 0%,#eee8ff 0,transparent 35%),linear-gradient(#f9f9ff,#f0f4ff);color:var(--ink);font-family:system-ui,'Arial',sans-serif;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:20px 16px 55px}.head{background:linear-gradient(135deg,#1c2c62,#5847c4 70%,#8664ea);padding:27px;border-radius:26px;color:#fff;box-shadow:0 16px 40px #2e286a35}.kicker{font-size:.85rem;letter-spacing:.03em;opacity:.9;font-weight:700}.head h1{margin:8px 0;font-size:clamp(1.7rem,4vw,2.7rem)}.head p{margin:0;opacity:.92}.tag{background:#ffffff24;border:1px solid #ffffff50;padding:6px 12px;border-radius:15px;display:inline-flex;margin-top:13px;font-size:.86rem}.note{border-inline-start:4px solid #edb640;background:#fff7db;padding:13px 17px;border-radius:15px;margin-top:15px;line-height:1.6;font-size:.92rem}.board{background:white;border:1px solid var(--line);border-radius:24px;padding:24px 23px;margin-top:17px;box-shadow:0 5px 20px #24448b0d}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.mini{font-size:.87rem;color:var(--muted);font-weight:650}#progressbar{height:12px;background:#e8e9fa;border-radius:50px;overflow:hidden;margin:17px 0}#progress{height:100%;width:0;background:linear-gradient(90deg,#4e9eeb,#9567f2);transition:width .3s}h2{margin:10px 0 15px;font-size:clamp(1.2rem,2.7vw,1.55rem);line-height:1.65;white-space:pre-wrap}.answers{display:grid;gap:10px}.answer{border:2px solid var(--line);border-radius:15px;background:white;padding:14px 16px;text-align:right;font-size:1rem;font-weight:690;color:var(--ink);min-height:58px;transition:transform .12s,border .12s}.answer:hover:not(:disabled){border-color:#8474d7;background:#f9f7ff;transform:translateY(-1px)}.answer:disabled{cursor:default}.answer.correct{background:#e7f8ee;border-color:#249468;color:#126746}.answer.wrong{background:#ffedf0;border-color:#cf4a66;color:#8a2442}.feedback{padding:15px;border-radius:15px;margin-top:14px;background:#eef3ff;line-height:1.6;display:none}.feedback.show{display:block}.primary{border:0;border-radius:15px;background:var(--purple);color:white;padding:14px 19px;font-size:1rem;font-weight:750;cursor:pointer;box-shadow:0 5px 12px #5847c42e}.primary:hover{background:#4937b0}.primary:disabled{background:#a5a8bd;cursor:not-allowed}.secondary{border:2px solid #d4d8f1;background:#fff;color:#4435ac;border-radius:15px;padding:11px 15px;cursor:pointer;font-weight:700}.actions{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}.stat{display:inline-block;margin:5px 5px 5px 0;background:#f3f5fd;padding:8px 11px;border-radius:10px;font-weight:700;color:#35405a}.score{font-size:3rem;font-weight:850;color:var(--purple)}.footer{margin-top:20px;color:#63728b;font-size:.8rem;text-align:center;line-height:1.6}.dot{display:inline-block;background:#ffe8a3;color:#5f4b11;border-radius:99px;padding:4px 9px;font-size:.82rem;font-weight:750}.short{font-size:.91rem;color:#64718d}.outcomes{text-align:center}.questions{display:grid;gap:10px}.checkitem{border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;cursor:pointer;align-items:center;line-height:1.5;font-weight:650}.checkitem input{width:23px;height:23px;accent-color:#5d47c8}.successpill{padding:12px;border-radius:12px;background:#e8f9ee;color:#116c48;font-weight:700}.count{font-variant-numeric:tabular-nums}.date-strip{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap}.date-strip span{font-size:.79rem;background:#f0ebff;color:#4937a0;border-radius:10px;padding:7px;font-weight:700}.date-strip span.active{background:#4937a0;color:white}@media(min-width:650px){.answers{grid-template-columns:1fr 1fr}.wrap{padding:24px}}</style></head><body><main class="wrap"><header class="head"><div class="kicker">🎮 משימת הכוכבים · כיתה ד׳</div><h1 id="pageTitle">שפה | שמות עצם · שמות תואר</h1><p id="subtitle">חזרה ליום 24.11 · 9 שאלות עם ניקוד והסברים · למידה חווייתית</p><span class="tag">🗓️ מועד המבחן: 30.11.2026</span></header><section class="board" id="game"><div class="topline"><span class="dot" id="phase">⭐ משחק</span><span class="mini"><span id="qcount">1 / 6</span> · <span id="score">0</span> נקודות</span></div><div id="progressbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress"></div></div><h2 id="question">טוען...</h2><div class="answers" id="answers"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="actions"><span class="short" id="hint">בחרו תשובה אחת</span><button class="primary hidden" id="next">לשאלה הבאה ⟵</button></div></section><section id="end" class="board hidden outcomes"><span style="font-size:52px">🏆</span><h2 id="endtitle">סיימתם!</h2><div class="score" id="percent"></div><p id="results"></p><div id="topics"></div><div class="actions" style="justify-content:center"><button class="primary" id="retry">🔁 שוב על השאלות</button><button class="secondary" id="wrongBtn">לתקן את הטעויות</button></div></section><p class="footer">התרגול הוא כלי למידה ולא מבחן רשמי. אין צורך בהרשמה או בהזנת פרטים אישיים.</p></main><script>(()=>{'use strict';let bank=[{"t": "שמות תואר", "q": "איזו מילה מתארת שם עצם?", "a": "גבוה", "opts": ["גבוה", "לרוץ", "מדרגה", "התיישב"], "why": "״גבוה״ הוא שם תואר המתאר תכונה."}, {"t": "שמות תואר", "q": "במשפט ״הילד הסקרן שאל שאלה״, מהו שם התואר?", "a": "הסקרן", "opts": ["הסקרן", "הילד", "שאל", "שאלה"], "why": "״הסקרן״ מתאר את הילד."}, {"t": "שמות תואר", "q": "איזה צמד מתאים מבחינת זכר/נקבה ומספר?", "a": "ספרים מעניינים", "opts": ["ספרים מעניינים", "ספרים מעניינת", "ספרים מעניין", "ספרים מעניינות"], "why": "״ספרים״ ברבים זכר, ולכן ״מעניינים״."}, {"t": "שמות עצם", "q": "במשפט ״הכלבה רצה בחצר״, מהו שם העצם המציין בעל חיים?", "a": "הכלבה", "opts": ["הכלבה", "רצה", "בחצר", "אין שם עצם"], "why": "״הכלבה״ הוא שם עצם המציין בעל חיים."}, {"t": "שמות תואר", "q": "השלימו: ״הילדות ____ פתרו את החידה״.", "a": "החרוצות", "opts": ["החרוצות", "החרוץ", "החרוצים", "החרוצה"], "why": "״ילדות״ הוא נקבה רבות, ולכן ״החרוצות״ מתאים."}, {"t": "שמות עצם", "q": "איזו מילה אינה שם עצם?", "a": "קפץ", "opts": ["קפץ", "בית", "חבר", "ענן"], "why": "״קפץ״ מתאר פעולה ולכן הוא פועל."}, {"t": "שמות תואר", "q": "מהו שם התואר במשפט ״ראינו סרט מצחיק״?", "a": "מצחיק", "opts": ["מצחיק", "סרט", "ראינו", "אין תואר"], "why": "״מצחיק״ מתאר איזה סרט ראינו."}, {"t": "שמות עצם", "q": "איזה צמד מכיל שני שמות עצם?", "a": "ילדה ומחברת", "opts": ["ילדה ומחברת", "כותב ומחברת", "אדום וילדה", "מהר ושמח"], "why": "ילדה ומחברת הם שמות של ישות וחפץ."}, {"t": "שמות עצם", "q": "איזו מילה היא שם עצם מופשט?", "a": "שמחה", "opts": ["שמחה", "שולחן", "עיפרון", "כיסא"], "why": "״שמחה״ היא רגש, ולכן שם עצם מופשט."}],name="שפה",phase="🧩 תרגול יומי",mode="1",index=0,points=0,wrong=[],stats={};const $=(s)=>document.getElementById(s),shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};function draw(){if(index>=bank.length){finish();return}let q=bank[index];$('qcount').textContent=(index+1)+' / '+bank.length;$('score').textContent=points;$('progress').style.width=(index/bank.length*100)+'%';$('progressbar').setAttribute('aria-valuenow',Math.round(index/bank.length*100));$('question').textContent=q.q;$('feedback').className='feedback';$('feedback').textContent='';$('next').classList.add('hidden');$('hint').textContent='בחרו את התשובה הנכונה';$('answers').innerHTML='';let opts=shuffle(q.opts);for(const txt of opts){let b=document.createElement('button');b.className='answer';b.textContent=txt;b.onclick=()=>choose(txt,b,q);$('answers').appendChild(b)}}function choose(val,btn,q){const good=val===q.a;stats[q.t]??={ok:0,total:0};stats[q.t].total++;if(good){points++;stats[q.t].ok++}else{wrong.push(q)}for(const el of $('answers').children){el.disabled=true;if(el.textContent===q.a)el.classList.add('correct');if(el===btn&&!good)el.classList.add('wrong')}$('feedback').textContent=(good?'✅ נכון מאוד! ':'💡 כמעט! התשובה הנכונה: '+q.a+'. ')+(q.why||'');$('feedback').className='feedback show';$('hint').textContent=good?'כל הכבוד!':'טעויות הן חלק מהלמידה';$('next').classList.remove('hidden');$('next').focus()}function finish(){$('game').classList.add('hidden');$('end').classList.remove('hidden');$('percent').textContent=Math.round(points/bank.length*100)+'%';$('endtitle').textContent=points/bank.length>=.85?'🌟 כל הכבוד, אלוף!':points/bank.length>=.65?'מצוין, ממשיכים להשתפר':'כל טעות היא הזדמנות ללמוד 💪';$('results').textContent=`ענית נכון על ${points} מתוך ${bank.length} שאלות.`;$('topics').innerHTML='';for(const [topic,st]of Object.entries(stats)){let s=document.createElement('span');s.className='stat';s.textContent=topic+': '+st.ok+'/'+st.total;$('topics').appendChild(s)}$('wrongBtn').disabled=wrong.length===0;try{localStorage.setItem('ariel-'+"שפה-24.11",JSON.stringify({date:new Date().toISOString(),score:points,total:bank.length}))}catch(e){}}$('next').onclick=()=>{index++;draw()};$('retry').onclick=()=>{bank=shuffle(bank);index=0;points=0;wrong=[];stats={};$('end').classList.add('hidden');$('game').classList.remove('hidden');draw()};$('wrongBtn').onclick=()=>{if(!wrong.length)return;bank=shuffle(wrong);index=0;points=0;wrong=[];stats={};$('end').classList.add('hidden');$('game').classList.remove('hidden');draw()};$('phase').textContent=phase;draw()})();</script></body></html>
